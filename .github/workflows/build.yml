name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # Any base branch, so stacked redesign PRs (phase N onto phase N-1) get CI too.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # Manual runs can add the screenshot pass (ui_check) without a code change.
  workflow_dispatch:
    inputs:
      ui_check:
        description: Take iPhone, iPad and Duo screenshots
        type: boolean
        default: true

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode and simulator
        run: scripts/ci/select-xcode.sh

      - name: Test BitLocalKit package
        working-directory: Packages/BitLocalKit
        run: swift test

      # Ad-hoc sign instead of CODE_SIGNING_ALLOWED=NO so the simulator app keeps
      # its entitlements; CloudKit traps at launch without them, which kills the
      # test host before any test runs.
      - name: Build
        run: |
          xcodebuild \
            -project bitlocal.xcodeproj \
            -scheme bitlocal \
            -configuration Debug \
            -destination "$SIM_DESTINATION" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            build-for-testing

      - name: Test
        run: |
          xcodebuild \
            -project bitlocal.xcodeproj \
            -scheme bitlocal \
            -configuration Debug \
            -destination "$SIM_DESTINATION" \
            -derivedDataPath build/DerivedData \
            -only-testing:bitlocalTests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            test-without-building

      # Screenshots of the main screens on iPhone, iPad and (if the runtime has
      # one) iPhone Duo. Printed into the log and uploaded; never fails the build.
      # Opt-in (about 25 minutes): a manual run, or "[ui-check]" in the head
      # commit message.
      - name: Visual UI check
        if: inputs.ui_check || contains(github.event.head_commit.message, '[ui-check]') || contains(github.event.pull_request.title, '[ui-check]')
        continue-on-error: true
        timeout-minutes: 45
        run: scripts/ci/ui-check.sh

      - name: Upload UI check screenshots
        if: inputs.ui_check || contains(github.event.head_commit.message, '[ui-check]') || contains(github.event.pull_request.title, '[ui-check]')
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ui-check
          path: build/ui-check/*.png
          retention-days: 7

      - name: Upload simulator app
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-build
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 1
