name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify Design & Convention Guardrails
        run: ./scripts/verify_design_conventions.sh

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Resolve iOS Simulator
        id: sim
        run: |
          chmod +x scripts/capture_sim_screenshots.sh
          SIM_UDID=""
          for attempt in 1 2 3 4 5; do
            if SIM_UDID="$(./scripts/capture_sim_screenshots.sh --device "iPhone 17" --resolve-udid 2>/dev/null)" && [[ -n "$SIM_UDID" ]]; then
              break
            fi
            echo "Waiting for CoreSimulator devices (attempt $attempt)..."
            sleep 5
          done
          if [[ -z "$SIM_UDID" ]]; then
            echo "Error: no available iOS Simulator found." >&2
            xcrun simctl list devices available >&2 || true
            exit 1
          fi
          echo "udid=${SIM_UDID}" >> "$GITHUB_OUTPUT"
          echo "Resolved simulator UDID: ${SIM_UDID}"

      # Ad-hoc sign instead of CODE_SIGNING_ALLOWED=NO so the simulator app keeps
      # its entitlements; CloudKit traps at launch without them, which kills the
      # test host before any test runs.
      - name: Build
        run: |
          xcodebuild \
            -project bitlocal.xcodeproj \
            -scheme bitlocal \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            build-for-testing

      - name: Test
        run: |
          xcodebuild \
            -project bitlocal.xcodeproj \
            -scheme bitlocal \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:bitlocalTests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            test-without-building

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-build
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 1
